name: Deploy chatbot and fraud detection

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-financial-chatbot.yml
      - supabase/config.toml
      - supabase/functions/financial-chatbot/**
      - supabase/functions/ml-fraud-detection/**
      - supabase/functions/_shared/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ai-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.109.1

      - name: Deploy chatbot and fraud detection to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: bokbbzzjjiosknxwfpvb
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to the repository's GitHub Actions secrets."
            exit 1
          fi
          supabase functions deploy financial-chatbot ml-fraud-detection --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
